name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jvm-android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x ./gradlew
      - name: JVM tests
        run: ./gradlew jvmTest --console=plain
      - name: Android compile
        run: ./gradlew compileReleaseKotlinAndroid --console=plain
      - name: JS compile
        run: ./gradlew compileKotlinJs --console=plain
      - name: Wasm compile
        run: ./gradlew compileKotlinWasmJs --console=plain

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x ./gradlew
      - name: iOS klib compile
        run: ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --console=plain
